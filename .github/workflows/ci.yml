# Roda a cada push e pull request: build e testes do backend (com containers reais) e das telas em Python.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar pacotes
        run: dotnet restore Nexo.slnx

      - name: Compilar (avisos viram erro)
        run: dotnet build Nexo.slnx --no-restore -c Release

      - name: Testes de unidade
        run: dotnet test tests/Nexo.UnitTests --no-build -c Release

      # Testcontainers sobe PostgreSQL, RabbitMQ e Redis usando o Docker do próprio runner.
      - name: Testes de integração
        run: dotnet test tests/Nexo.IntegrationTests --no-build -c Release

      - name: Pacotes com vulnerabilidade conhecida
        run: dotnet list Nexo.slnx package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Estilo e erros comuns (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes do console e da análise
        run: pytest -q

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construir as imagens do Docker Compose
        run: docker compose --env-file .env.example build
